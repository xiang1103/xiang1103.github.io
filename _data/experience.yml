# Experience entries, newest first. Rendered by _includes/sections/timeline.html.
#
# Per entry — only `date` is required, so an entry can be a bare line of text or
# a full role listing:
#
#   date            the label in the left gutter, e.g. "2024 — Present"
#   role            bold heading line, e.g. "Undergraduate Researcher"
#   org             organisation, shown after "·"
#   org_url         makes the org a link with an outbound arrow
#   previous_roles  list of earlier titles at the same org, shown under the heading
#   points          list of short markdown lines, rendered as chevron bullets.
#                   This is the normal way to describe a role — one idea per
#                   line, so the entry can be scanned rather than read.
#   body            markdown paragraph, for an entry that really wants prose.
#                   Renders above `points` if both are given.
#   skills          list of strings, rendered as pills
#   links           list of { label, href }, rendered as small buttons
#   tag             small label above the heading
#   image / alt     thumbnail
#
# LINKS INSIDE A BULLET — `points` and `body` are markdown, so use [text](url):
#
#   points:
#     - Presented at the [April 2026 URECA Symposium](https://www.stonybrook.edu/ureca/)
#     - "[Fall 2026 MIT Undergraduate Technology Conference](https://mutc.mit.edu/) —
#        quote the line whenever it *starts* with a bracket, or YAML reads it as a list"
#
# Three things to watch:
#   1. A line starting with "[" must be quoted, as above — otherwise YAML parses
#      it as a nested sequence and the build fails or eats the text.
#   2. A line containing ": " must also be quoted (same reason, YAML sees a map);
#      the CSE 214 bullet below already is.
#   3. In a local file path, encode spaces as %20 and parens as %28 %29, or the
#      markdown link stops at the first space. `links:` hrefs do NOT need this —
#      they are plain YAML strings, not markdown.
#
# A bare URL is not auto-linked; wrap it: [github.com/me](https://github.com/me).
# External links get target="_blank" added by nothing at all right now — they
# open in the same tab. Say the word if they should open in a new one.

