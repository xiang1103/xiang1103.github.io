# Skills, rendered as labelled rows of pills by _includes/sections/skills.html.
#
# Per group:
#   label  the row heading
#   items  a list; each item is either a plain string, or a map:
#            - name: Python        the pill text
#              icon: python        a file in assets/img/tech/ (without .svg)
#
# Logos available right now (assets/img/tech/):
#   bash  c  cplusplus  css3  docker  flask  git  github  html5  java
#   javascript  jupyter  mysql  nodejs  numpy  opencv  pandas  postgresql
#   python  pytorch  react  scikitlearn  tensorflow  typescript
#
# Need one that isn't listed? Any name from https://devicon.dev works — ask and
# it gets fetched into assets/img/tech/. An item with no `icon:` is just text.
#
# ⚠️  THE LISTS BELOW ARE PLACEHOLDERS. They are a plausible stack for a CS
# undergrad doing AI research, NOT a record of what Xiang actually uses.
# Replace them with the real thing before this section means anything.

main:
  - label: Software Engineering
    items:
      - name: Python
        icon: python
      - name: Java
        icon: java
      - name: C++
        icon: cplusplus
      - name: JavaScript
        icon: javascript
      - name: React
        icon: react
      - name: Git
        icon: git
      - name: Docker
        icon: docker
      - name: PostgreSQL
        icon: postgresql

  - label: Machine Learning
    items:
