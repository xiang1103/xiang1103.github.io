# Skills, rendered as labelled rows of pills by _includes/sections/skills.html.
#
# Per group:
#   label  the row heading
#   items  a list; each item is either a plain string, or a map:
#            - name: Python        the pill text
#              icon: python        a file in assets/img/tech/ (without .svg)
#              chip: true          optional — white backing in dark mode, for
#                                  logos that are dark-on-transparent
#
# Logos available in assets/img/tech/:
#   aws  bash  c  claude  cplusplus  css3  databricks  docker  fastapi  flask
#   git  github  html5  huggingface  java  javascript  jupyter  mongodb  mysql
#   nextjs  nodejs  numpy  opencv  pandas  postgresql  python  pytorch  r
#   react  scikitlearn  supabase  tensorflow  typescript
#
# Need one that isn't here? Most names on https://devicon.dev or
# https://simpleicons.org can be fetched on request. An item with no `icon:`
# renders as a text-only pill, which is the right fallback while waiting.
#
# NOTE: Docker, PostgreSQL, React and JavaScript came from the original
# placeholder set and were never explicitly confirmed — drop any that aren't
# accurate.

main:
  - label: Software Engineering
    items:
      - name: Python
        icon: python
      - name: Java
        icon: java
      - name: C
        icon: c
      - name: R
        icon: r
      - name: JavaScript
        icon: javascript
      - name: TypeScript
        icon: typescript
      - name: HTML
        icon: html5
      - name: CSS
        icon: css3
      - name: React
        icon: react
      - name: Next.js
        icon: nextjs
        chip: true          # black disc, invisible on the dark theme
      - name: FastAPI
        icon: fastapi
      - name: Git
        icon: git
      - name: Docker
        icon: docker
      - name: AWS
        icon: aws
        chip: true          # navy wordmark, invisible on the dark theme
      - name: Databricks
        icon: databricks
      - name: MongoDB
        icon: mongodb
      - name: MySQL
        icon: mysql
        chip: true          # dark dolphin, faint on the dark theme
      - name: PostgreSQL
        icon: postgresql
      - name: Supabase
        icon: supabase
      - name: Claude
        icon: claude

  - label: Machine Learning
    items:
      - name: PyTorch
        icon: pytorch
      - name: scikit-learn
        icon: scikitlearn
      - name: OpenCV
        icon: opencv
      - name: NumPy
        icon: numpy
      - name: pandas
        icon: pandas
      - name: Hugging Face
        icon: huggingface
      - name: Jupyter
        icon: jupyter
