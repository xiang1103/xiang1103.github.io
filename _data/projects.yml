# Projects, rendered by _includes/sections/showcase.html: media in the left
# gutter, the write-up beside it. The mirror of the Experience timeline, so the
# two sections line up down the page.
#
# Per entry:
#   title    required. The heading.
#   href     optional. Makes the title and the media a link, with an arrow.
#   tag      optional. Small label above the title, e.g. "URECA 2025".
#   body     optional. Markdown paragraph.
#   points   optional. List of markdown lines -> chevron bullets, as in
#            _data/experience.yml. Use body or points or both.
#   image    optional. A still. `alt:` describes it.
#   size     optional but recommended. "WIDTHxHEIGHT" of the file, e.g.
#            "640x363" — stops the text below jumping as the picture loads.
#   video    optional. A video file (mp4/webm). `poster:` is the still shown
#            before play. Takes precedence over `image` if both are given.
#   skills   optional. List of strings -> pills.
#   links    optional. List of { label, href } -> small buttons. New tab.
#
# IMAGE CONVENTIONS
#
# NOTHING IS CROPPED. A picture fills the width of the media column and keeps
# its own proportions, so a tall image makes a taller row than a wide one. That
# is expected — the column is a column, not a grid of matching tiles.
#
#   WHERE   assets/img/projects/
#   NAME    kebab-case, matching the project: stanford-cars.jpg
#   FORMAT  .jpg for anything photographic (screenshots of the real world,
#           dataset samples, plots of photos) — quality 85 or so.
#           .png only when the picture is mostly flat color or crisp text (a UI
#           screenshot, a diagram, an architecture drawing) — PNG keeps those
#           sharp, and JPEG smears them. PNG on a photo is a trap: the same
#           picture came out 367 KB as PNG and 69 KB as JPEG.
#   WIDTH   640px. The column displays it around 184px, so 640 covers a 3x
#           screen with room to spare; anything larger is bytes nobody sees.
#           Export at 640 wide and let the height fall where it falls.
#   SHAPE   roughly landscape. Nothing needs to match anything else, but an
#           image taller than it is wide makes a row much taller than its own
#           text, which leaves an odd gap. If a picture is portrait, crop it to
#           landscape yourself before exporting — that way you choose what goes,
#           rather than the CSS choosing for you.
#   WEIGHT  aim under 150 KB, and treat 300 KB as the line not to cross. The
#           whole point of this site is that it loads instantly.
#   SIZE    put the file's real pixel dimensions in `size:`. It is optional, but
#           without it the browser does not know how tall the row will be until
#           the picture arrives, and the text below shifts when it does. On a
#           Mac:  sips -g pixelWidth -g pixelHeight assets/img/projects/thing.jpg
#   ALT     always. One sentence describing what the picture shows, not "image
#           of ..." — screen readers already say it is an image.
#
# A one-liner that does the resize, the format and the quality at once:
#
#   magick source.png -resize 640x -strip -quality 86 \
#     assets/img/projects/my-project.jpg
#
# VIDEO
#   Same folder, .mp4 (H.264). `poster:` is required in practice — the frame is
#   blank without one, because the video is preload="none" and downloads nothing
#   until the reader presses play. That is what keeps a clip free on page load.
#   No autoplay: it would move the page while it is being read. `size:` applies
#   to video too.
#
# MISSING MEDIA
#   An entry with no image or video spans the full width. Once ANY entry in the
#   section has media, the ones without it keep the gutter empty instead, so
#   every title still starts in the same column.
#
# Seeded from work already described elsewhere on the site — expand these with
# real descriptions, screenshots, and repo links.

main:
  - title: WorkIt
    image: assets/img/WorkIt.png
    alt: WorkIt's login page for businesses
    size: 640x363
    body: >-
      One place for both sides of hiring. Job seekers get fresh listings gathered and
      sorted from across the web, matched to what they are looking for, and a tool that
      fills in the applications for them. Businesses get a dashboard to manage applicants,
      track where each one is in the interview process, screen resumes, and see which
      candidates fit the role best. In progress.

  - title: Advising Bot
    image: assets/img/advising_bot.png
    alt: The advising bot answering a student's question
    size: 640x363
    body: >-
      A chatbot that answers academic advising questions for Stony Brook students. It reads
      the entire undergraduate bulletin, so its answers come from the real requirements
      rather than guesswork, and it remembers what a student has already asked. A question
      that meant digging through the bulletin, or waiting on an advising appointment, now
      takes a few seconds.
    links:
      - label: Code
        href: https://github.com/xiang1103/Advising_Bot

  - title: Car Model Brand Detector
    image: /assets/img/projects/stanford-cars.jpg
    alt: An example of Stanford Cars dataset used for training, labelled by class
    size: 640x363
    body: >-
      A model that names the make and model of a car from a single photo. Built by training
      image recognition networks from scratch on a dataset of labelled car photos, then
      using Grad-CAM to highlight the parts of the picture the model actually looked at, so
      its answers can be checked rather than trusted blindly. A small project for the fun of
      pointing deep learning at something everyday.
    links:
      - label: Code
        href: https://github.com/xiang1103/Car-Brand-Detector

  - title: Molecule Optimization with LLMs and Genetic Algorithms
    image: assets/img/molecule.png
    alt: Molecules generated by the pipeline, drawn as chemical structures
    size: 640x363
    body: >-
      Drug discovery begins with finding molecules worth testing, and asking a language
      model for them alone tends to produce ones that could never exist. This project pairs
      the model with a genetic algorithm, a method that breeds and refines candidates over
      many rounds, so the suggestions stay chemically valid while still being new. It gets
      there without the cost of running several models against each other.
    links:
      - label: Report
        href: "assets/files/CSE_487_Report__Improved_Molecule_Generation_Using_Large_Language_Models_In_Genetic_Algorithms%20(1).pdf"
