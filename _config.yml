# --- Page structure ----------------------------------------------------------
# The homepage is composed from _sections/*.md rather than one markdown file, so
# a section can hold arbitrary HTML, SVG, graphics, or its own include.
# `output: false` keeps sections from becoming standalone pages of their own.
collections:
  sections:
    output: false

# --- Build -------------------------------------------------------------------
# No remote_theme: every layout, include, and stylesheet is local to this repo.
exclude:
  - vendor/          # local gem install; must be listed since a custom
  - .bundle/         # exclude list replaces Jekyll's defaults
  - assets/img/IMG_4275.jpeg   # 1.2 MB source photo; only its crops are published
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - CLAUDE.md
